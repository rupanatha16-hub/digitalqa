<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo Prompt Library</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--surface:#131c31;--ink:#e8eefc;--muted:#8fa0c4;--line:#25324f;--accent:#22d3ee;--accent-ink:#04212a;--chip:#1b2742;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:16px;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-weight:700;font-size:1.9rem;line-height:1.15;margin:8px 0 6px}
.sub{margin:0 0 16px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);color:var(--ink);font:inherit;font-weight:500;padding:8px 16px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#list{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:0}
.card img{display:block;width:100%;height:auto;background:var(--chip)}
.body{padding:10px 12px 12px}
.title{font-weight:700;margin:0 0 4px}
.prompt{margin:0 0 10px;font-size:.85rem;word-break:break-word;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.prompt.open{display:block}
.row{display:flex;gap:10px;align-items:center}
.btn{font:inherit;font-weight:700;font-size:.9rem;border:0;border-radius:10px;padding:6px 16px;min-height:34px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.alt{background:var(--chip);color:var(--ink)}
.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#admin{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 20px}
#admin h2{margin:0 0 10px;font-size:1.1rem}
#admin input,#admin select,#admin textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:0 0 10px}
#admin textarea{min-height:110px}
.msg{color:var(--muted);font-size:.9rem;margin:8px 0 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Photo Prompt Library</h1>
<p class="sub">Tap Copy, open Gemini or ChatGPT, add your photo and paste.</p>

<section id="admin" hidden>
<h2>Admin</h2>
<form id="loginForm">
<input id="em" type="email" placeholder="Email" autocomplete="username">
<input id="pw" type="password" placeholder="Password" autocomplete="current-password">
<button class="btn" type="submit">Login</button>
</form>
<div id="upForm" hidden>
<input id="file" type="file" accept="image/*">
<input id="ttl" type="text" placeholder="Title">
<select id="cat"></select>
<textarea id="prm" placeholder="Prompt"></textarea>
<div class="row"><button class="btn" id="pub" type="button">Publish</button><button class="btn alt" id="out" type="button">Logout</button></div>
</div>
<p class="msg" id="msg"></p>
</section>

<div class="chips" id="chips" role="group" aria-label="Category"></div>
<div id="list"></div>
<p class="msg" id="empty" hidden>No prompts yet.</p>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,addDoc,getDocs,deleteDoc,doc,query,orderBy,limit,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app=initializeApp({
  apiKey:"AIzaSyDgvmTp_r5QApbrsF4wIc7Oulxxofp_Zm4",
  authDomain:"digitalqa-1e726.firebaseapp.com",
  projectId:"digitalqa-1e726",
  storageBucket:"digitalqa-1e726.firebasestorage.app",
  messagingSenderId:"608838619299",
  appId:"1:608838619299:web:9de318e69cf03953076f16"
});
const db=getFirestore(app), auth=getAuth(app);
const CATS=["Profile","Thumbnail","Poster","Festival","Fun","Old Photo","Business"];
const $=id=>document.getElementById(id);
let items=[], cur="All", isAdmin=false;
const isAdminPage=location.hash==="#admin";

if(isAdminPage)$("admin").hidden=false;
CATS.forEach(c=>{const o=document.createElement("option");o.value=o.textContent=c;$("cat").appendChild(o)});

function chips(){
  const ch=$("chips");ch.innerHTML="";
  ["All",...CATS].forEach(n=>{
    const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=n;
    b.setAttribute("aria-pressed",n===cur);
    b.onclick=()=>{cur=n;chips();render()};
    ch.appendChild(b);
  });
}
function copyText(t,b){
  const done=()=>{const o=b.textContent;b.textContent="Copied";setTimeout(()=>b.textContent=o,1500)};
  const fb=()=>{const a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){}a.remove()};
  navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t).then(done,fb):fb();
}
function render(){
  const l=$("list");l.innerHTML="";
  const show=items.filter(x=>cur==="All"||x.cat===cur);
  $("empty").hidden=show.length>0;
  show.forEach(x=>{
    const c=document.createElement("article");c.className="card";
    const im=document.createElement("img");im.src=x.img;im.alt=x.title||"Prompt photo";im.loading="lazy";c.appendChild(im);
    const b=document.createElement("div");b.className="body";
    if(x.title){const t=document.createElement("p");t.className="title";t.textContent=x.title;b.appendChild(t)}
    const p=document.createElement("p");p.className="prompt";p.textContent=x.prompt;p.onclick=()=>p.classList.toggle("open");b.appendChild(p);
    const r=document.createElement("div");r.className="row";
    const cb=document.createElement("button");cb.className="btn";cb.type="button";cb.textContent="Copy";cb.onclick=()=>copyText(x.prompt,cb);r.appendChild(cb);
    if(isAdmin){
      const d=document.createElement("button");d.className="btn alt";d.type="button";d.textContent="Delete";
      d.onclick=async()=>{if(!confirm("Delete this prompt?"))return;try{await deleteDoc(doc(db,"prompts",x.id));await load()}catch(e){$("msg").textContent="Delete failed: "+e.message}};
      r.appendChild(d);
    }
    b.appendChild(r);c.appendChild(b);l.appendChild(c);
  });
}
async function load(){
  try{
    const s=await getDocs(query(collection(db,"prompts"),orderBy("createdAt","desc"),limit(40)));
    items=s.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){items=[];$("empty").textContent="Could not load prompts."}
  render();
}
function shrink(file){
  return new Promise((ok,no)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{
      const s=Math.min(1,700/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",0.68));
    };
    img.onerror=no;img.src=u;
  });
}
$("loginForm").onsubmit=async e=>{
  e.preventDefault();$("msg").textContent="Logging in...";
  try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value);$("pw").value="";$("msg").textContent=""}
  catch(err){$("msg").textContent="Login failed. Check email and password."}
};
$("out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
  isAdmin=!!u&&isAdminPage;
  $("loginForm").hidden=isAdmin;$("upForm").hidden=!isAdmin;
  render();
});
$("pub").onclick=async()=>{
  const f=$("file").files[0],p=$("prm").value.trim();
  if(!f||!p){$("msg").textContent="Choose a photo and write the prompt.";return}
  $("pub").disabled=true;$("msg").textContent="Publishing...";
  try{
    const img=await shrink(f);
    await addDoc(collection(db,"prompts"),{title:$("ttl").value.trim(),cat:$("cat").value,prompt:p,img:img,createdAt:serverTimestamp()});
    $("file").value="";$("ttl").value="";$("prm").value="";$("msg").textContent="Published.";
    await load();
  }catch(err){$("msg").textContent="Failed: "+err.message}
  $("pub").disabled=false;
};
chips();load();
</script>
</body>
</html>
