<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DIGITAL QA - Admin</title>
<style>
:root{--n:#19c3ff;--g:#ffc633}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Arial,sans-serif}
body{background:#050b1a;color:#e8f1ff;padding:12px;min-height:100vh}
h1{font-size:20px;color:var(--n);margin-bottom:10px}
.card{background:#0c1a3a;border:1px solid #19c3ff55;border-radius:14px;padding:14px;margin-bottom:12px}
input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #19c3ff66;background:#07122b;color:#fff;font-size:15px}
label{font-size:13px;color:#9db6dd}
.b{background:linear-gradient(135deg,#19c3ff,#2563eb);color:#fff;border:0;border-radius:20px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block;margin:3px 3px 3px 0}
.g{background:linear-gradient(135deg,#ffc633,#ff9d00);color:#111}
.gr{background:#25d366;color:#fff}
.rd{background:#ef4444;color:#fff}
.ok{background:#16a34a;color:#fff;font-size:17px;padding:12px 20px}
.no{background:#dc2626;color:#fff;font-size:17px;padding:12px 20px}
.mid{background:#334155;color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.note{font-size:12px;color:#9db6dd;margin:4px 0}
.msg{font-size:13px;color:#ffe29a;margin:6px 0}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700;margin-right:4px}
.s-Received{background:#2563eb}.s-Pending{background:#ca8a04}.s-Approved{background:#16a34a}.s-Rejected{background:#dc2626}.s-Completed{background:#0d9488}
.p-Pending{background:#ca8a04}.p-Paid{background:#16a34a}.p-Failed{background:#dc2626}
.r{border-top:1px solid #ffffff14;padding-top:8px;margin-top:8px;font-size:14px;line-height:1.6}
.r b{color:var(--g)}
.sec{display:none}
</style>
</head>
<body>

<div id="lg" class="card">
<h1>Admin लॉगिन</h1>
<label>ईमेल</label><input id="em" type="email" autocomplete="username">
<label>पासवर्ड</label><input id="pw" type="password" autocomplete="current-password">
<button class="b g" onclick="login()">लॉगिन करें</button>
<div class="msg" id="lm"></div>
</div>

<div id="ad" class="sec">
<div class="top"><h1>DIGITAL QA - Admin</h1><button class="b rd" onclick="logout()">लॉगआउट</button></div>
<div class="card">
<label>सर्च (नाम / मोबाइल / ID)</label><input id="q" oninput="draw()" placeholder="खोजें">
<label>स्टेटस फ़िल्टर</label>
<select id="fs" onchange="draw()"><option value="">सभी</option><option>Received</option><option>Pending</option><option>Approved</option><option>Rejected</option><option>Completed</option></select>
<label>पेमेंट फ़िल्टर</label>
<select id="fp" onchange="draw()"><option value="">सभी</option><option>Pending</option><option>Paid</option><option>Failed</option></select>
<label>सेवा फ़िल्टर</label>
<select id="fv" onchange="draw()"><option value="">सभी</option></select>
<button class="b" onclick="load()">🔄 रिफ़्रेश</button>
<div class="note" id="cnt"></div>
</div>
<div id="ls"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var FB={apiKey:"AIzaSyDgvmTp_r5QApbrsF4wIc7Oulxxofp_Zm4",authDomain:"digitalqa-1e726.firebaseapp.com",projectId:"digitalqa-1e726",appId:"1:608838619299:web:9de318e69cf03953076f16"};
firebase.initializeApp(FB);
var auth=firebase.auth(),db=firebase.firestore(),DATA=[];
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

function login(){
var e=$("em").value.trim(),p=$("pw").value;
if(!e||!p){$("lm").textContent="ईमेल और पासवर्ड लिखें";return}
$("lm").textContent="लॉगिन हो रहा है...";
auth.signInWithEmailAndPassword(e,p).catch(function(){$("lm").textContent="लॉगिन नहीं हुआ। ईमेल/पासवर्ड जाँचें।"})}
function logout(){auth.signOut()}

auth.onAuthStateChanged(function(u){
if(u){$("lg").style.display="none";$("ad").style.display="block";$("pw").value="";load()}
else{$("lg").style.display="block";$("ad").style.display="none";DATA=[]}});

function load(){
$("cnt").textContent="लोड हो रहा है...";
db.collection("applications").orderBy("createdAt","desc").get().then(function(s){
DATA=[];s.forEach(function(d){DATA.push(d.data())});
var sv={};DATA.forEach(function(x){if(x.service)sv[x.service]=1});
var cur=$("fv").value,h='<option value="">सभी</option>';
Object.keys(sv).sort().forEach(function(k){h+='<option'+(k===cur?' selected':'')+'>'+esc(k)+'</option>'});
$("fv").innerHTML=h;
draw()}).catch(function(){$("cnt").textContent="लिस्ट नहीं आई। Rules या इंटरनेट जाँचें।"})}

function draw(){
var q=$("q").value.trim().toLowerCase(),fs=$("fs").value,fp=$("fp").value,fv=$("fv").value,o="",n=0;
DATA.forEach(function(d){
if(fs&&d.status!==fs)return;
if(fp&&d.paymentStatus!==fp)return;
if(fv&&d.service!==fv)return;
if(q&&((d.name||"")+" "+(d.mobile||"")+" "+(d.id||"")).toLowerCase().indexOf(q)<0)return;
n++;
var t=d.createdAt&&d.createdAt.toDate?d.createdAt.toDate().toLocaleString("hi-IN"):"";
var x=d.extra||{},ex="";
if(x.cibil||x.income||x.employment||x.amount)ex='<br>🏦 CIBIL: '+esc(x.cibil)+' | आय: ₹'+esc(x.income)+' | काम: '+esc(x.employment)+' | राशि: ₹'+esc(x.amount);
var wa="https://wa.me/91"+esc(d.mobile)+"?text="+encodeURIComponent("नमस्ते "+(d.name||"")+", DIGITAL QA से। आपकी Application ID "+d.id+" के बारे में।");
o+='<div class="card"><b style="color:#19c3ff">'+esc(d.id)+'</b> <span class="note">'+esc(t)+'</span><br>'+
'<span class="tag s-'+esc(d.status)+'">'+esc(d.status)+'</span><span class="tag p-'+esc(d.paymentStatus)+'">पेमेंट: '+esc(d.paymentStatus)+'</span>'+
'<div class="r"><b>नाम:</b> '+esc(d.name)+'<br><b>मोबाइल:</b> '+esc(d.mobile)+(d.email?'<br><b>ईमेल:</b> '+esc(d.email):'')+
'<br><b>सेवा:</b> '+esc(d.service)+'<br><b>शुल्क:</b> '+(d.price?'₹'+esc(d.price):'संपर्क करें')+
'<br><b>Payment Ref:</b> '+esc(d.payRef||"-")+'<br><b>जानकारी:</b> '+esc(d.details||"-")+ex+'</div>'+
'<div class="r"><button class="b ok" onclick="setS(\''+esc(d.id)+'\',\'Approved\')">✅ मंज़ूर</button>'+
'<button class="b no" onclick="setS(\''+esc(d.id)+'\',\'Rejected\')">❌ अस्वीकार</button><br>'+
'<button class="b mid" onclick="setS(\''+esc(d.id)+'\',\'Pending\')">⏳ Pending</button>'+
'<button class="b mid" onclick="setS(\''+esc(d.id)+'\',\'Completed\')">🏁 काम पूरा</button></div>'+
'<div class="r"><button class="b ok" onclick="setP(\''+esc(d.id)+'\',\'Paid\')">💰 पैसा आ गया</button>'+
'<button class="b no" onclick="setP(\''+esc(d.id)+'\',\'Failed\')">पेमेंट Failed</button></div>'+
'<div class="r"><a class="b" href="tel:'+esc(d.mobile)+'">📞 कॉल</a><a class="b gr" target="_blank" rel="noopener" href="'+wa+'">💬 WhatsApp</a></div></div>'});
$("ls").innerHTML=o||'<div class="card note">कोई रिक्वेस्ट नहीं मिली।</div>';
$("cnt").textContent="कुल: "+n+" / "+DATA.length}

function setS(id,v){
if(!confirm("पक्का "+v+" करें?"))return;
db.collection("applications").doc(id).update({status:v,history:firebase.firestore.FieldValue.arrayUnion({s:v,t:Date.now()})}).then(function(){alert("स्टेटस बदल गया");load()}).catch(function(){alert("बदल नहीं पाया। दोबारा कोशिश करें।")})}

function setP(id,v){
if(!confirm("पक्का पेमेंट "+v+" करें?"))return;
db.collection("applications").doc(id).update({paymentStatus:v}).then(function(){alert("पेमेंट बदल गया");load()}).catch(function(){alert("बदल नहीं पाया। दोबारा कोशिश करें।")})}
</script>
</body>
</html>
